[project]
name = "rxiv2pdf"
version = "0.1.0"
description = "Turn a bioRxiv/medRxiv preprint into a two-column, journal-style PDF built from its JATS XML."
readme = "README.md"
license = "MIT AND OFL-1.1"  # code MIT; bundled Source Serif/Sans fonts OFL-1.1
license-files = ["LICENSE", "src/rxiv2pdf/fonts/OFL-*.md"]
authors = [{ name = "Ali Zaeim" }]
requires-python = ">=3.11"
keywords = ["biorxiv", "medrxiv", "preprint", "jats", "pdf", "typst"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "httpx>=0.27",
    "lxml>=5.3",
    "pillow>=11.0",
    "rich>=13.7",
    "typer>=0.16",  # older versions crash on --help with Click 8.2+
    "typst>=0.15",  # Compiler.compile_with_warnings / query with sys_inputs
]

[project.scripts]
rxiv2pdf = "rxiv2pdf.cli:main"

[project.urls]
Homepage = "https://github.com/ali-zaeim/rxiv2pdf"
Repository = "https://github.com/ali-zaeim/rxiv2pdf"
Issues = "https://github.com/ali-zaeim/rxiv2pdf/issues"
Changelog = "https://github.com/ali-zaeim/rxiv2pdf/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.17,<0.18"]  # ruff pinned: its default rule set changes between minor versions

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: hits the live bioRxiv/medRxiv servers (run with: pytest -m network)",
]
